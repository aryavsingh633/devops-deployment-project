
name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-app:${{ github.sha }} .

      - name: Start application container
        run: docker run -d --name devops-app -p 8080:80 devops-app:${{ github.sha }}

      - name: Wait for application
        run: sleep 3

      - name: Check application health
        run: bash scripts/health-check.sh

      - name: Show logs on failure
        if: failure()
        run: docker logs devops-app

      - name: Stop container
        if: always()
        run: docker rm -f devops-app || true

  publish-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            aryav17/devops-deployment-project:latest
            aryav17/devops-deployment-project:${{ github.sha }}

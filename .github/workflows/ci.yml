
name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: Build and test application
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t devops-app:${{ github.sha }} .

      - name: Start application container
        run: |
          docker run -d \
            --name devops-app \
            -p 8080:80 \
            devops-app:${{ github.sha }}

      - name: Wait for application
        run: sleep 3

      - name: Check application health
        run: |
          bash scripts/health-check.sh http://localhost:8080

      - name: Show logs on failure
        if: failure()
        run: docker logs devops-app

      - name: Stop container
        if: always()
        run: docker rm -f devops-app || true


  # JOB 2: Build and publish Docker image
  publish-image:
    name: Publish Docker Image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            aryav17/devops-deployment-project:latest
            aryav17/devops-deployment-project:${{ github.sha }}


  # JOB 3: Deploy application to AWS EC2
  deploy:
    name: Deploy to AWS EC2
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/github-actions-ec2
          chmod 600 ~/.ssh/github-actions-ec2

      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/github-actions-ec2 \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" "
              set -e

              sudo docker pull aryav17/devops-deployment-project:$IMAGE_TAG

              sudo docker rm -f devops-app || true

              sudo docker run -d \
                --name devops-app \
                --restart unless-stopped \
                -p 80:80 \
                aryav17/devops-deployment-project:$IMAGE_TAG

              sleep 3

              curl -fsS http://localhost/ > /dev/null

              echo 'Deployment successful!'
            "

      - name: Verify deployed application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl -fsS "http://$EC2_HOST/" > /dev/null
          echo "EC2 application is responding successfully!"
